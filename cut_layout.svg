<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <style>
    .sheet { fill:#f3f3f3; stroke:#999; stroke-width:2 }
    .part { fill:#fffbe6; stroke:#222; stroke-width:1.2 }
    .cut { fill: none; stroke:#c33; stroke-width:2 }
    .cut-area { fill:#fee; opacity:0.25 }
    .txt { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#000 }
    .label { font-family: Arial, font-size:12px; fill:#000 }
    .dim { font-family: Arial, font-size:12px; fill:#006; }
    .dash { stroke:#006; stroke-width:1; stroke-dasharray:6 3; fill:none }
  </style>

  <rect x="20" y="20" width="1120" height="880" class="sheet"/>
  <text x="30" y="44" class="txt">Plywood sheet layout (48" x 96") — parts and divider pieces included</text>

  <!-- Left side panel (trapezoid) -->
  <polygon points="40,120 280,120 360,420 40,420" class="part"/>
  <text x="60" y="140" class="label">Left side panel (trapezoid)</text>
  <text x="60" y="160" class="label">H 10.75" | Top depth 11.75" | Back depth 15.75"</text>

  <!-- Right side panel (mirror) -->
  <polygon points="760,120 1000,120 1120,420 760,420" class="part"/>
  <text x="780" y="140" class="label">Right side panel (mirror)</text>
  <text x="780" y="160" class="label">H 10.75" | Top depth 11.75" | Back depth 15.75"</text>

  <!-- Dividers (3) -->
  <polygon points="320,120 360,120 420,420 320,420" class="part"/>
  <text x="330" y="140" class="label">Divider 1 (trapezoid)</text>
  <polygon points="460,120 500,120 560,420 460,420" class="part"/>
  <text x="470" y="140" class="label">Divider 2 (trapezoid)</text>
  <polygon points="680,120 720,120 780,420 680,420" class="part"/>
  <text x="690" y="140" class="label">Divider 3 (trapezoid)</text>

  <!-- Top panel -->
  <rect x="40" y="460" width="1120" height="120" class="part"/>
  <text x="60" y="490" class="label">Top panel — 36.75" × 11.75"</text>

  <!-- Back panel with door cutouts area (visual only) -->
  <rect x="40" y="600" width="1120" height="220" class="part"/>
  <text x="60" y="630" class="label">Back panel — 36.75" × 10.75" (shown with door cutouts)</text>

  <!-- Door cutouts on back panel (represent openings) -->
  <!-- Use 0.25" gap between adjacent cutouts, reposition door pieces to nesting area -->
  <g id="back-cutouts">
    <!-- Dog A opening -->
    <rect x="150" y="650" width="138" height="200" class="cut-area"/>
    <rect x="150" y="650" width="138" height="200" class="cut"/>
    <text x="160" y="760" class="label">Dog opening A — 9.00" W × 10.00" H</text>

    <!-- Dog B opening (moved right to keep 0.25" gap) -->
    <rect x="288" y="650" width="138" height="200" class="cut-area"/>
    <rect x="288" y="650" width="138" height="200" class="cut"/>
    <text x="298" y="760" class="label">Dog opening B — 9.00" W × 10.00" H</text>

    <!-- Dog C opening -->
    <rect x="426" y="650" width="138" height="200" class="cut-area"/>
    <rect x="426" y="650" width="138" height="200" class="cut"/>
    <text x="436" y="760" class="label">Dog opening C — 9.00" W × 10.00" H</text>

    <!-- Tool opening -->
    <rect x="564" y="650" width="92" height="200" class="cut-area"/>
    <rect x="564" y="650" width="92" height="200" class="cut"/>
    <text x="568" y="760" class="label">Tool opening — 6.00" W × 10.00" H</text>
  </g>

  <!-- Door pieces (moved to nesting area to avoid overlap) -->
  <g id="door-pieces">
    <rect x="760" y="120" width="138" height="200" class="part"/>
    <text x="770" y="240" class="label">Dog door piece — 9.25" × 10" (qty 3)</text>

    <rect x="906" y="120" width="92" height="200" class="part"/>
    <text x="916" y="240" class="label">Tool door piece — 6.25" × 10"</text>
  </g>

  <!-- Dimension callouts for internal layout (schematic) -->
  <line x1="170" y1="550" x2="170" y2="620" class="dash"/>
  <text x="180" y="565" class="dim">9.00" (dog width)</text>
  <line x1="318" y1="550" x2="318" y2="620" class="dash"/>
  <text x="328" y="565" class="dim">9.00" (dog width)</text>
  <line x1="466" y1="550" x2="466" y2="620" class="dash"/>
  <text x="476" y="565" class="dim">9.00" (dog width)</text>
  <line x1="612" y1="550" x2="612" y2="620" class="dash"/>
  <text x="622" y="565" class="dim">6.00" (tool bay)</text>

  <text x="40" y="930" class="label">Notes: Cutouts shown on back panel are the interior openings for the drop-down doors. Adjacent cutouts spaced with 0.25" gap. Door pieces have been moved to a separate nesting area to avoid overlap. No kerf compensation applied.</text>
</svg>
