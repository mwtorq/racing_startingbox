<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .part { fill:#fffbe6; stroke:#222; stroke-width:1.2 }
    .acrylic { fill:#e6f7ff; stroke:#0a8; stroke-width:1 }
    .txt { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#000 }
    .label { font-family: Arial; font-size:12px; fill:#000 }
    .dashed { stroke:#666; stroke-width:1; stroke-dasharray:6 4; fill:none }
  </style>

  <text x="20" y="30" class="txt">Exploded assembly (front is angled, rear doors are bottom-hinged drop-down)</text>

  <!-- Top panel (floating) -->
  <rect x="320" y="60" width="560" height="100" class="part"/>
  <text x="350" y="120" class="label">Top panel — 36.75" × 11.75"</text>

  <!-- Side panels -->
  <polygon points="200,220 320,220 380,420 200,420" class="part"/>
  <text x="210" y="240" class="label">Left side (trapezoid)</text>

  <polygon points="880,220 1000,220 1000,420 880,420" class="part"/>
  <text x="890" y="240" class="label">Right side (trapezoid)</text>

  <!-- Dividers -->
  <polygon points="360,220 420,220 420,420 360,420" class="part"/>
  <text x="365" y="240" class="label">Divider 1</text>

  <polygon points="500,220 560,220 560,420 500,420" class="part"/>
  <text x="505" y="240" class="label">Divider 2</text>

  <polygon points="720,220 780,220 780,420 720,420" class="part"/>
  <text x="725" y="240" class="label">Divider 3</text>

  <!-- Back panel -->
  <rect x="200" y="440" width="800" height="90" class="part"/>
  <text x="210" y="480" class="label">Back panel (doors cut out)</text>

  <!-- Doors (rear) -->
  <rect x="280" y="540" width="120" height="100" class="part"/>
  <text x="290" y="575" class="label">Dog door 1 – 9.25" ×10"</text>

  <rect x="440" y="540" width="120" height="100" class="part"/>
  <text x="450" y="575" class="label">Dog door 2</text>

  <rect x="680" y="540" width="120" height="100" class="part"/>
  <text x="690" y="575" class="label">Dog door 3</text>

  <rect x="840" y="540" width="80" height="100" class="part"/>
  <text x="845" y="575" class="label">Tool door – 6.25" ×10"</text>

  <!-- Plexi (front) -->
  <rect x="360" y="200" width="450" height="160" class="acrylic"/>
  <text x="380" y="210" class="label">Plexiglass — 28.50" × 10.00"</text>
  <text x="380" y="230" class="label">Mounted with surface trim strips</text>

  <!-- Callouts -->
  <line x1="600" y1="160" x2="600" y2="220" class="dashed"/>
  <text x="610" y="190" class="label">Front hinge (piano hinge) across top of plexi area</text>

  <line x1="260" y1="520" x2="260" y2="460" class="dashed"/>
  <text x="100" y="500" class="label">Rear bottom hinges on doors (drop-down)</text>

  <text x="20" y="650" class="txt">Notes: All vertical pieces have front slanted edge to match front slope; top front edge sits 4" behind bottom front edge.</text>
</svg>
