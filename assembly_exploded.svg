<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <style>
    .outline{fill:none;stroke:#222;stroke-width:2}
    .cut{fill:none;stroke:#c33;stroke-width:2}
    .dimline{stroke:#006;stroke-width:1}
    .text{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#000}
    .note{font-family:Arial;font-size:11px;fill:#333}
    .ghost{fill:#fee;opacity:.2}
  </style>

  <text x="20" y="24" class="text">back_panel_detail.svg — precise cut file for back panel (36.75" × 10.75")</text>

  <!-- Back panel outline -->
  <rect x="40" y="40" width="820" height="340" class="outline"/>
  <text x="60" y="64" class="text">Back panel: 36.75" W × 10.75" H</text>

  <!-- Coordinate system / scale note -->
  <text x="60" y="86" class="note">Scale: drawing is for reference; 1 unit = 1 px. Use dimensions below for cutting. No kerf compensation applied.</text>

  <!-- Cutout group: positions chosen to match cut_layout.svg (0.25" gaps) -->
  <!-- Conversion: visually map 1" = 20 px (approx). 9" = 180 px, 6" = 120 px, 10" = 200 px, gap 0.25" = 5 px -->
  <g id="cutouts">
    <!-- Dog A: left offset 3.5" from left edge -->
    <rect x="120" y="80" width="180" height="200" class="ghost"/>
    <rect x="120" y="80" width="180" height="200" class="cut"/>
    <text x="130" y="295" class="text">Dog A: 9.00" × 10.00"</text>

    <!-- Dog B: positioned to right of A with 0.25" gap -->
    <rect x="305" y="80" width="180" height="200" class="ghost"/>
    <rect x="305" y="80" width="180" height="200" class="cut"/>
    <text x="315" y="295" class="text">Dog B: 9.00" × 10.00"</text>

    <!-- Dog C -->
    <rect x="490" y="80" width="180" height="200" class="ghost"/>
    <rect x="490" y="80" width="180" height="200" class="cut"/>
    <text x="500" y="295" class="text">Dog C: 9.00" × 10.00"</text>

    <!-- Tool opening (6" wide) -->
    <rect x="675" y="80" width="120" height="200" class="ghost"/>
    <rect x="675" y="80" width="120" height="200" class="cut"/>
    <text x="680" y="295" class="text">Tool: 6.00" × 10.00"</text>
  </g>

  <!-- Dimensioning: overall width and height -->
  <line x1="60" y1="400" x2="900" y2="400" class="dimline"/>
  <text x="480" y="418" class="text">36.75" overall width</text>

  <line x1="20" y1="60" x2="20" y2="420" class="dimline"/>
  <text x="2" y="240" class="text" transform="rotate(-90 12,240)">10.75" overall height</text>

  <!-- Spacing dims between cutouts (0.25") -->
  <line x1="300" y1="40" x2="305" y2="40" class="dimline"/>
  <text x="300" y="32" class="text">0.25" gap</text>

  <line x1="488" y1="40" x2="493" y2="40" class="dimline"/>
  <text x="488" y="32" class="text">0.25" gap</text>

  <!-- Hinge block locations (bottom inside each opening) -->
  <rect x="120" y="276" width="40" height="8" fill="#d0c" stroke="#a00"/>
  <text x="168" y="286" class="note">Hinge block 2" H (mount at bottom inside opening)</text>

  <rect x="305" y="276" width="40" height="8" fill="#d0c" stroke="#a00"/>
  <rect x="490" y="276" width="40" height="8" fill="#d0c" stroke="#a00"/>
  <rect x="675" y="276" width="40" height="8" fill="#d0c" stroke="#a00"/>

  <text x="40" y="460" class="note">Notes: Dimensions given are final-cut sizes. Add kerf compensation if your tool requires it. All gaps set to 0.25" between adjacent openings. Doors recommended to be 9.25" × 10.00" (allow 1/8" play for hinges and latches).</text>
</svg>
